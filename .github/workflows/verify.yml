# Candidate for .github/workflows/verify.yml in the standalone shift repository.
# No deployment, credentials persistence, paid runner, cache or artifact upload.
name: Shift exact-revision checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # This bounded workflow is approved for standard public-repository runners only.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      RUSTUP_TOOLCHAIN: "1.99.0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the exact requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify checkout identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'Testing exact revision %s\n' "$EXPECTED_SHA"
      - name: Set disposable browser storage on the allocated runner
        timeout-minutes: 1
        run: |
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/playwright-browsers\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Set up pinned Node without a dependency cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Check the committed static bundle with only Node on PATH
        timeout-minutes: 2
        run: |
          node --version
          node_only="$RUNNER_TEMP/node-only-bin"
          mkdir -p "$node_only"
          ln -s "$(command -v node)" "$node_only/node"
          # No Cargo, npm, Python, browser, dependency installation or network in this gate.
          PATH="$node_only" "$node_only/node" scripts/check-static.mjs
          sha256sum web/assets/shift_core.wasm > "$RUNNER_TEMP/committed-wasm.sha256"
      - name: Check JavaScript syntax
        timeout-minutes: 2
        run: |
          node --check web/app.js
          node --check web/fixtures/frame.js
          node --check web/fixtures/v1/checkout.js
          node --check web/fixtures/v2/checkout.js
      - name: Install the pinned Rust toolchain and WASM target
        timeout-minutes: 5
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustc --version
          cargo --version
      - name: Check Rust formatting, strict Clippy and native tests
        timeout-minutes: 5
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
      - name: Rebuild WASM and bind it to the committed static artifact
        timeout-minutes: 5
        run: |
          bash scripts/build.sh
          # A mismatch is a failed source/artifact binding, never a reason to auto-commit.
          sha256sum --check "$RUNNER_TEMP/committed-wasm.sha256"
      - name: Run actual WASM and source regression suites
        timeout-minutes: 3
        run: |
          node tests/wasm.mjs
          node tests/review-regressions.mjs
          node tests/cancel-regression.mjs
      - name: Install locked browser tools and their Chromium
        timeout-minutes: 6
        run: |
          npm ci --prefix tests/browser-runner --ignore-scripts --no-audit --no-fund
          node tests/browser-runner/node_modules/playwright/cli.js install --with-deps chromium
      - name: Build the localhost fixture controller
        timeout-minutes: 3
        run: |
          cargo build --locked --bin shift-fixture
      - name: Run controller HTTP regressions and real Chromium against it
        timeout-minutes: 5
        run: |
          export CHROMIUM_PATH="$(node -e "process.stdout.write(require('./tests/browser-runner/node_modules/playwright').chromium.executablePath())")"
          "$CHROMIUM_PATH" --version
          ./target/debug/shift-fixture web > "$RUNNER_TEMP/shift-controller.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --max-time 2 --retry 30 --retry-connrefused --retry-delay 1 --retry-max-time 30 http://127.0.0.1:4183/ > /dev/null
          node tests/controller.mjs
          node tests/controller-security.mjs
          SHIFT_URL=http://127.0.0.1:4183 node tests/browser.mjs
      - name: Run real Chromium against the separate static-host mode
        timeout-minutes: 5
        run: |
          export CHROMIUM_PATH="$(node -e "process.stdout.write(require('./tests/browser-runner/node_modules/playwright').chromium.executablePath())")"
          "$CHROMIUM_PATH" --version
          python3 -m http.server 4184 --bind 127.0.0.1 --directory web > "$RUNNER_TEMP/shift-static.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --max-time 2 --retry 30 --retry-connrefused --retry-delay 1 --retry-max-time 30 http://127.0.0.1:4184/ > /dev/null
          SHIFT_URL=http://127.0.0.1:4184 node tests/browser.mjs
